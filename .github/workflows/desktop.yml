name: AgentFlow desktop

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - run: npm ci
      - run: npm test
      - name: Run Tauri Rust tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
      - run: npm run lint
      - run: npm run format:check
      - run: npm run security:scan
      - run: npm run build:tauri
      - run: npm run smoke:release
      - name: Upload Linux bundle
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: agentflow-linux-bundle
          path: apps/desktop/src-tauri/target/release/bundle/**
      - name: Upload macOS bundle
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: agentflow-macos-bundle
          path: apps/desktop/src-tauri/target/release/bundle/**
      - name: Upload Windows bundle
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: agentflow-windows-bundle
          path: apps/desktop/src-tauri/target/release/bundle/**
